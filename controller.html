<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>ACSL Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#fff;font-family:'Barlow Condensed',sans-serif;padding:28px}h1{font-family:Anton;color:#04a550;letter-spacing:2px}.sub{color:#777;text-transform:uppercase;letter-spacing:1px;margin-top:3px}.layout{display:grid;grid-template-columns:300px 1fr 360px;gap:16px;margin-top:22px;max-width:1500px}.card{background:#141414;border:1px solid #242424;border-radius:12px;padding:18px}.title{font-family:Anton;color:var(--primary,#04a550);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}.teams{display:flex;flex-direction:column;gap:8px}.team{border:1px solid #292929;background:#0d0d0d;color:white;padding:14px;border-radius:8px;cursor:pointer;font-family:'Barlow Condensed';font-size:18px;font-weight:800;text-align:left}.team.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 20%,#0d0d0d)}.team small{display:block;color:#777;font-size:12px}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.pos{grid-column:1/-1;color:var(--primary);font-weight:900;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #242424;padding:12px 0 4px}.player{background:#0d0d0d;border:1px solid #262626;border-radius:10px;padding:12px;cursor:pointer;color:#fff;text-align:left;font-family:'Barlow Condensed'}.player:hover,.player.active{border-color:var(--primary)}.row{display:flex;gap:12px;align-items:center}.num{font-family:Anton;color:var(--number,var(--primary));font-size:40px;width:52px;text-align:center}.name{font-size:25px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{color:var(--primary);font-weight:900;letter-spacing:1px;font-size:16px}.stats{color:#aaa;font-size:16px;margin-top:8px;line-height:1.5}.preview{min-height:180px;background:#0d0d0d;border:1px solid #242424;border-radius:10px;padding:18px}.preview .name{font-family:Anton;font-size:36px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button.big{font-family:Anton;font-size:20px;letter-spacing:2px;border:0;border-radius:8px;padding:18px;cursor:pointer}.intro{background:var(--primary);color:#fff}.outro{background:#c0392b;color:#fff}button:disabled{opacity:.3;cursor:not-allowed}.status{margin-top:10px;color:#777;font-weight:800;letter-spacing:1px}.overlay-wrap{margin-top:16px;border:1px solid #242424;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#181818 0 25%,#111 0 50%) 0/18px 18px;position:relative}.overlay-wrap iframe{width:1920px;height:1080px;border:0;transform-origin:top left;position:absolute;top:0;left:0}.note{color:#777;font-size:13px;margin-top:10px;line-height:1.4}.loading{color:var(--primary);font-weight:900}</style>
</head><body>
<h1>ACSL LIVE STATS CONTROLLER</h1><div class="sub">Alle Teams · Klick auf Spieler lädt Live Stats</div>
<div class="layout">
<div class="card"><div class="title">Teams</div><div id="teams" class="teams"></div><div class="note">Google Sheet: <b>1xvOhJUz...</b><br>Stats werden live per Klick aus dem jeweiligen Tabellen-Tab gelesen.</div></div>
<div class="card"><div class="title" id="rosterTitle">Spieler</div><div id="players" class="players"><div class="loading">Team wählen...</div></div></div>
<div class="card"><div class="title">Kontrolle</div><div class="preview" id="preview">Kein Spieler ausgewählt</div><div class="controls"><button class="big intro" id="intro" disabled>INTRO</button><button class="big outro" id="outro" disabled>OUTRO</button></div><div class="status" id="status">OFFLINE</div><div class="overlay-wrap" id="ow"><iframe id="frame" src="overlay.html"></iframe></div></div>
</div>
<script>
const SHEET_ID='1xvOhJUz4OfIsNpxE4fA-MoIhIDjz7T1j7UmWPBXifvA';
const TEAMS={
 meduni:{label:'MedUni Serpents',sheet:'Med Uni Serpents',logo:'meduni_serpents.png',primary:'#04a550',secondary:'#FFC200',numberColor:'#04a550',ranges:{QB:[20,22],RB:[20,22],WR:[24,31]}},
 robots:{label:'TU Robots',sheet:'TU Robots',logo:'tu_robots.png',primary:'#000000',secondary:'#722899',accent:'#c1c1c1',numberColor:'#c1c1c1',labelColor:'#c1c1c1',ranges:{QB:[27,28],RB:[27,33],WR:[35,45]}},
 beez:{label:'BOKU Beez',sheet:'Boku Beez',logo:'boku_beez.jpg',primary:'#FFC200',secondary:'#000000',numberColor:'#FFC200',ranges:{QB:[27,28],RB:[27,30],WR:[32,39]}},
 tigers:{label:'WU Tigers',sheet:'WU Tigers',logo:'wu_tigers.png',primary:'#3e00ff',secondary:'#ff0c00',accent:'#3fa8f4',numberColor:'#ffffff',ranges:{QB:[27,28],RB:[27,29],WR:[31,41]}}
};
let currentTeam=null, selected=null, visible=false, frame=null;
function $(id){return document.getElementById(id)}
function colNum(l){let n=0;l=(l||'').toUpperCase();for(let i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return n-1}
function clean(v){if(!v)return '--';let s=String(v.f||v.v||'').trim();return s||'--'}
function get(c,col){let i=colNum(col);return i>=0&&c[i]?clean(c[i]):'--'}
function addNums(a,b){let x=parseFloat(String(a).replace(',','.')), y=parseFloat(String(b).replace(',','.')); if(isNaN(x))x=0;if(isNaN(y))y=0; let s=x+y; return s?String(s):'--'}
function rows(a){let r=[];for(let i=a[0];i<=a[1];i++)r.push(i);return r}
function posLong(p){if(p==='QB')return 'Quarterback';if(p==='RB')return 'Running Back';if(p==='WR')return 'Wide Receiver';if(p==='TE')return 'Tight End';if(p==='WR/TE')return 'Wide Receiver / Tight End';return p}
function scale(){let ow=$('ow'), sc=ow.clientWidth/1920; let fr=$('frame'); fr.style.transform='scale('+sc+')'; ow.style.height=(1080*sc)+'px'}
window.addEventListener('resize',scale); window.addEventListener('load',()=>{frame=$('frame');scale();renderTeams();selectTeam('meduni')})
function renderTeams(){let box=$('teams');box.innerHTML='';Object.entries(TEAMS).forEach(([id,t])=>{let b=document.createElement('button');b.className='team';b.innerHTML=t.label+'<small>'+t.sheet+'</small>';b.disabled=!!t.disabled;b.onclick=()=>selectTeam(id);box.appendChild(b)})}
function setTheme(t){document.documentElement.style.setProperty('--primary',t.primary);document.documentElement.style.setProperty('--secondary',t.secondary);document.documentElement.style.setProperty('--number',t.numberColor||t.primary)}
function selectTeam(id){currentTeam=TEAMS[id];setTheme(currentTeam);document.querySelectorAll('.team').forEach((b,i)=>b.classList.toggle('active',Object.keys(TEAMS)[i]===id));$('rosterTitle').textContent=currentTeam.label+' Spieler'; selected=null; renderPreview(); loadRoster(currentTeam)}
function fetchRow(team,pos,row){return new Promise(res=>{let cb='__acsl_'+pos+'_'+row+'_'+Date.now()+Math.random().toString(36).slice(2);let url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?sheet='+encodeURIComponent(team.sheet)+'&range=A'+row+':BG'+row+'&tqx='+encodeURIComponent('out:json;responseHandler:'+cb)+'&cachebust='+Date.now();window[cb]=function(resp){try{let rd=resp.table.rows[0]; if(!rd||!rd.c)return res(null); let c=rd.c, p=null; if(pos==='QB'){let first=get(c,'AG'), last=get(c,'AH'), num=get(c,'AF'); if(first==='--')return res(null); p={team:team.label,logo:team.logo,primary:team.primary,secondary:team.secondary,numberColor:team.numberColor,labelColor:team.labelColor,number:num,name:(first+' '+(last==='--'?'':last)).trim(),position:'Quarterback',s1v:get(c,'AI')+'/'+get(c,'AJ'),s1l:'ATT/COMP',s2v:get(c,'AP'),s2l:'TOTAL YDS',s3v:get(c,'AQ'),s3l:'TOTAL TD',s4v:get(c,'AR'),s4l:'INT'};}
else if(pos==='RB'){let first=get(c,'AX'), last=get(c,'AY'), num=get(c,'AW'); if(first==='--')return res(null); let td=addNums(get(c,'BD'),get(c,'BF')); p={team:team.label,logo:team.logo,primary:team.primary,secondary:team.secondary,numberColor:team.numberColor,labelColor:team.labelColor,number:num,name:(first+' '+(last==='--'?'':last)).trim(),position:'Running Back',s1v:get(c,'AZ'),s1l:'CARRIES',s2v:get(c,'BC'),s2l:'RUSH YDS',s3v:td,s3l:'TD',s4v:'',s4l:''};}
else {let first=get(c,'AX'), last=get(c,'AY'), num=get(c,'AW'); if(first==='--')return res(null); let td=addNums(get(c,'BD'),get(c,'BF')); p={team:team.label,logo:team.logo,primary:team.primary,secondary:team.secondary,numberColor:team.numberColor,labelColor:team.labelColor,number:num,name:(first+' '+(last==='--'?'':last)).trim(),position:'Wide Receiver / Tight End',s1v:get(c,'BA'),s1l:'REC',s2v:get(c,'BE'),s2l:'REC YDS',s3v:td,s3l:'TD',s4v:'',s4l:''};} res(p)}catch(e){res(null)}finally{delete window[cb]; let s=document.getElementById('s_'+cb); if(s)s.remove()}};let s=document.createElement('script');s.id='s_'+cb;s.src=url;s.onerror=()=>res(null);document.body.appendChild(s)})}
async function loadRoster(team){let box=$('players');box.innerHTML='<div class="loading">Lade Spieler...</div>';let groups=['QB','RB','WR'], data={QB:[],RB:[],WR:[]};for(const g of groups){for(const r of rows(team.ranges[g])){let p=await fetchRow(team,g,r);if(p)data[g].push(p)}}renderPlayers(data)}
function renderPlayers(data){let box=$('players');box.innerHTML='';let count=0;['QB','RB','WR'].forEach(g=>{if(!data[g].length)return;let h=document.createElement('div');h.className='pos';h.textContent=g==='QB'?'Quarterback':(g==='RB'?'Running Back':'Wide Receiver / Tight End');box.appendChild(h);data[g].forEach(p=>{count++;let b=document.createElement('button');b.className='player';b.innerHTML='<div class="row"><div class="num">'+(p.number||'#')+'</div><div><div class="name">'+p.name+'</div><div class="tag">'+p.position+'</div></div></div><div class="stats">'+p.s1v+' '+p.s1l+' · '+p.s2v+' '+p.s2l+' · '+p.s3v+' '+p.s3l+(p.s4l?' · '+p.s4v+' '+p.s4l:'')+'</div>';b.onclick=()=>{document.querySelectorAll('.player').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectPlayer(p)};box.appendChild(b)})});if(!count)box.innerHTML='<div class="loading">Keine Spieler gefunden. Sheet-Name/Zeilen prüfen.</div>'}
function selectPlayer(p){selected=p;renderPreview();send({type:'player',...p})}
function renderPreview(){if(!selected){$('preview').innerHTML='Kein Spieler ausgewählt';$('intro').disabled=true;return}let p=selected;$('preview').innerHTML='<div class="num">'+p.number+'</div><div class="name">'+p.name+'</div><div class="tag">'+p.team+' · '+p.position+'</div><div class="stats">'+p.s1v+' '+p.s1l+' · '+p.s2v+' '+p.s2l+' · '+p.s3v+' '+p.s3l+(p.s4l?' · '+p.s4v+' '+p.s4l:'')+'</div>';$('intro').disabled=visible;$('outro').disabled=!visible}
function send(o){if(frame)frame.contentWindow.postMessage(o,'*')}
$('intro').onclick=()=>{if(!selected)return;send({type:'player',...selected});setTimeout(()=>send({type:'intro'}),50);visible=true;$('status').textContent='ON AIR';renderPreview()}
$('outro').onclick=()=>{send({type:'outro'});visible=false;$('status').textContent='OFFLINE';setTimeout(renderPreview,500)}
</script></body></html>
