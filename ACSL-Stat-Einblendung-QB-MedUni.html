<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ACSL Player Overlay - PaperCut vMix Live Sheet</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="overlay">
    <div class="paper-main"></div>
    <div class="mint-left"></div>
    <div class="mint-right"></div>

    <div class="number-paper"></div>
    <div class="number" id="number">--</div>

    <div class="player-info">
        <div class="name" id="name">Lade Sheet...</div>
        <div class="position" id="position">--</div>
    </div>

    <div class="stats">
        <div class="stat">
      	     <div class="value" id="attcomp">--/--</div>
	     <div class="label">ATT/COMP</div>
        </div>

        <div class="stat">
            <div class="value" id="yds">--</div>
            <div class="label">YDS</div>
        </div>

        <div class="stat">
            <div class="value" id="td">--</div>
            <div class="label">TD</div>
        </div>
    </div>

    <div class="logo-paper"></div>
    <div class="logo">
        <img src="logo.png" alt="ACSL Logo">
    </div>
</div>

<script>
    var SHEET_ID = "1MDbf9wj0oGWA7RF6cTFwlwVtzQr2DmzeFBeJThqiZZM";
    var SHEET_NAME = "Med Uni Serpents";
    var PLAYER_ROW = 2;
    var REFRESH_MS = 2000;

    function clean(value) {
        if (value === null || value === undefined) return "--";
        value = String(value).trim();
        return value === "" ? "--" : value;
    }

    function setText(id, value) {
        document.getElementById(id).textContent = clean(value);
    }

    function handleSheetData(response) {
        try {
            var row = response.table.rows[0];
            if (!row || !row.c) throw new Error("Keine Daten in A" + PLAYER_ROW + ":G" + PLAYER_ROW);

            var c = row.c;
            setText("name", c[0] && (c[0].f || c[0].v));
            setText("number", c[1] && (c[1].f || c[1].v));
            setText("position", c[2] && (c[2].f || c[2].v));
            var att = clean(c[3] && (c[3].f || c[3].v));
	    var comp = clean(c[4] && (c[4].f || c[4].v));
  	    setText("attcomp", att + "/" + comp);
            setText("yds", c[5] && (c[5].f || c[5].v));
	    setText("td", c[6] && (c[6].f || c[6].v));
        } catch (e) {
            setText("name", "Keine Sheet-Daten");
            setText("position", "Zeile / Tab prüfen");
            setText("number", "--");
            setText("attcomp", "--/--");
            setText("yds", "--");
	    setText("td", "--");
        }
    }

    function loadSheet() {
        var old = document.getElementById("sheet-jsonp");
        if (old) old.parentNode.removeChild(old);

        var range = "A" + PLAYER_ROW + ":G" + PLAYER_ROW;
        var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq" +
            "?sheet=" + encodeURIComponent(SHEET_NAME) +
            "&range=" + encodeURIComponent(range) +
            "&tqx=" + encodeURIComponent("out:json;responseHandler:handleSheetData") +
            "&cachebust=" + new Date().getTime();

        var script = document.createElement("script");
        script.id = "sheet-jsonp";
        script.src = url;
        document.body.appendChild(script);
    }

    loadSheet();
    setInterval(loadSheet, REFRESH_MS);
</script>

</body>
</html>
