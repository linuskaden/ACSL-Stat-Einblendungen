<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>ACSL Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif}#lt{position:absolute;bottom:55px;left:0;width:1720px;height:315px;opacity:0;transform:translateX(-120px);transition:.45s cubic-bezier(.22,1,.36,1)}#lt.visible{opacity:1;transform:translateX(0)}.banner{position:absolute;inset:0;background:#0a0a0a;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);box-shadow:0 0 40px rgba(0,0,0,.5)}.stripe{position:absolute;left:0;top:0;width:26px;height:100%;background:var(--primary,#04a550)}.logoBox{position:absolute;left:26px;top:0;width:315px;height:315px;background:var(--primary,#04a550);display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,88% 0,100% 100%,0 100%)}.logoBox img{max-width:235px;max-height:235px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}.info{position:absolute;left:380px;top:42px}.num{font-family:Anton;font-size:104px;color:var(--number,var(--primary,#04a550));line-height:.9}.name{font-family:Anton;font-size:92px;color:white;text-transform:uppercase;letter-spacing:2px;line-height:1;max-width:820px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:4px 4px 0 rgba(0,0,0,.5)}.pos{display:inline-block;margin-top:14px;background:var(--primary,#04a550);color:white;font-size:32px;font-weight:900;padding:6px 22px;letter-spacing:3px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}.stats{position:absolute;left:1040px;bottom:50px;display:flex;gap:28px;align-items:flex-end}.stat{text-align:center;min-width:115px;border-left:2px solid rgba(255,255,255,.12);padding-left:24px}.stat:first-child{border-left:0}.val{font-family:Anton;color:#fff;font-size:72px;line-height:1;white-space:nowrap}.lbl{color:var(--label,#04a550);font-weight:900;font-size:18px;letter-spacing:2px;text-transform:uppercase;margin-top:7px}.accent{position:absolute;bottom:0;left:0;width:100%;height:9px;background:linear-gradient(90deg,var(--primary),var(--secondary),transparent)}</style></head><body>
<div id="lt"><div class="banner"></div><div class="stripe"></div><div class="logoBox"><img id="logo" src="meduni_serpents.png"></div><div class="info"><div class="num" id="number">--</div><div class="name" id="name">SPIELER</div><div class="pos" id="position">--</div></div><div class="stats"><div class="stat"><div class="val" id="s1v">--</div><div class="lbl" id="s1l">--</div></div><div class="stat"><div class="val" id="s2v">--</div><div class="lbl" id="s2l">--</div></div><div class="stat"><div class="val" id="s3v">--</div><div class="lbl" id="s3l">--</div></div><div class="stat" id="stat4"><div class="val" id="s4v">--</div><div class="lbl" id="s4l">--</div></div></div><div class="accent"></div></div>
<script>const lt=document.getElementById('lt');function set(id,v){document.getElementById(id).textContent=v||'--'}window.addEventListener('message',e=>{const d=e.data;if(!d||!d.type)return;if(d.type==='player'){document.documentElement.style.setProperty('--primary',d.primary||'#04a550');document.documentElement.style.setProperty('--secondary',d.secondary||'#FFC200');document.documentElement.style.setProperty('--number',d.numberColor||d.primary||'#04a550');document.documentElement.style.setProperty('--label',d.labelColor||d.primary||'#04a550');document.getElementById('logo').src=(d.logo||'meduni_serpents.png')+'?v='+Date.now();set('number',d.number);set('name',d.name);set('position',d.position);set('s1v',d.s1v);set('s1l',d.s1l);set('s2v',d.s2v);set('s2l',d.s2l);set('s3v',d.s3v);set('s3l',d.s3l);set('s4v',d.s4v);set('s4l',d.s4l);document.getElementById('stat4').style.display=d.s4l?'block':'none'}if(d.type==='intro')lt.className='visible';if(d.type==='outro')lt.className='';});</script></body></html>
